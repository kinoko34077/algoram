[package]
name = "algoram-catalog"
version = "0.1.0"
edition = "2021"
description = "Capability catalog and marketplace discovery model for Algoram"

[dependencies]
algoram-core = { path = "../core" }
algoram-package = { path = "../package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
algoram-composite = { path = "../composite" }
algoram-runtime = { path = "../runtime" }
algoram-interop = { path = "../interop" }
