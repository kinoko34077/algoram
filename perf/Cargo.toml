[package]
name = "algoram-perf-baseline"
version = "0.1.0"
edition = "2021"
description = "Bounded cache proof and performance baseline harness for Algoram"

[dependencies]
algoram-core = { path = "../core" }
algoram-python-importer = { path = "../importers/python" }
algoram-c-importer = { path = "../importers/c" }
algoram-interop = { path = "../interop" }
algoram-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
