[package]
name = "algoram-resilience"
version = "0.1.0"
edition = "2021"
description = "Read-only failure impact and recovery analysis for Algoram"

[dependencies]
algoram-catalog = { path = "../catalog" }
algoram-core = { path = "../core" }
algoram-interop = { path = "../interop" }
algoram-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
