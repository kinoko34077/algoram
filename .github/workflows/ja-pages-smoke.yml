name: Japanese Pages Smoke

on:
  push:
    branches:
      - chatgpt/162-live-pages-smoke

permissions:
  contents: read

jobs:
  live-pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Browser toolchain
        run: |
          google-chrome --version
          python --version
          python -m pip install --disable-pip-version-check --no-cache-dir selenium==4.36.0

      - name: Inspect live Pages shell
        run: |
          url="https://kinoko34077.github.io/algoram/?smoke=$(date +%s)"
          curl --fail --silent --show-error --location --dump-header /tmp/algoram-headers.txt --output /tmp/algoram-index.html "$url"
          cat /tmp/algoram-headers.txt
          cat /tmp/algoram-index.html
          grep -F '<html lang="ja">' /tmp/algoram-index.html
          grep -F '<title>Algoram プロトタイプ</title>' /tmp/algoram-index.html

      - name: Verify live Japanese Pages at desktop and narrow sizes
        env:
          ALGORAM_PAGES_URL: https://kinoko34077.github.io/algoram/
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base_url = os.environ["ALGORAM_PAGES_URL"]
          sizes = [(480, 900), (1440, 900)]
          results = []

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.set_capability("goog:loggingPrefs", {"browser": "ALL"})

          driver = webdriver.Chrome(options=options)
          try:
            for width, height in sizes:
              driver.set_window_size(width, height)
              url = f"{base_url}?smoke={int(time.time() * 1000)}-{width}"
              driver.get(url)
              try:
                WebDriverWait(driver, 20).until(
                  lambda d: d.find_elements(By.CSS_SELECTOR, ".app-shell")
                )
              except Exception:
                body = driver.find_element(By.TAG_NAME, "body").text
                print(json.dumps({
                  "kind": "live-japanese-pages-debug",
                  "viewport": f"{width}x{height}",
                  "current_url": driver.current_url,
                  "ready_state": driver.execute_script("return document.readyState"),
                  "body_text": body[:3000],
                  "page_source": driver.page_source[:3000],
                  "browser_log": driver.get_log("browser"),
                }, ensure_ascii=False))
                raise

              body_text = driver.find_element(By.TAG_NAME, "body").text
              lang = driver.execute_script("return document.documentElement.lang")
              document_metrics = driver.execute_script(
                "return {"
                "  scrollWidth: document.documentElement.scrollWidth,"
                "  clientWidth: document.documentElement.clientWidth,"
                "  innerWidth: window.innerWidth"
                "}"
              )

              header_block_label = driver.find_element(By.CSS_SELECTOR, ".header-stat span").get_attribute("textContent").strip()
              plan_label = driver.find_element(
                By.CSS_SELECTOR, 'button[aria-controls="runtime-execution-panel"]'
              ).text
              file_label = driver.find_element(
                By.CSS_SELECTOR, ".file-menu > summary"
              ).text
              search_label = driver.find_element(
                By.CSS_SELECTOR, ".search-panel"
              ).get_attribute("aria-label")
              graph_editor_label = driver.find_element(
                By.CSS_SELECTOR, ".graph-region"
              ).get_attribute("aria-label")

              assert lang == "ja", f"{width}x{height}: expected html lang=ja, got {lang!r}"
              assert header_block_label == "ブロック", (
                f"{width}x{height}: header block label {header_block_label!r}"
              )
              assert plan_label in {"実行計画", "計画中…", "計画を再試行", "再計画"}, (
                f"{width}x{height}: plan label {plan_label!r}"
              )
              assert file_label == "ファイル", f"{width}x{height}: file label {file_label!r}"
              assert search_label == "グラフ検索", (
                f"{width}x{height}: search aria-label {search_label!r}"
              )
              assert graph_editor_label == "グラフエディター", (
                f"{width}x{height}: graph editor aria-label {graph_editor_label!r}"
              )

              if width <= 600:
                overflow_summary = driver.find_element(
                  By.CSS_SELECTOR, ".header-overflow-menu > summary"
                )
                assert overflow_summary.text == "その他", (
                  f"{width}x{height}: overflow label {overflow_summary.text!r}"
                )
                driver.execute_script("arguments[0].click()", overflow_summary)
                overflow_text = driver.find_element(
                  By.CSS_SELECTOR, ".header-overflow-popover"
                ).text
                assert (
                  "インスペクターを隠す" in overflow_text
                  or "インスペクターを表示" in overflow_text
                ), f"{width}x{height}: localized inspector action absent: {overflow_text!r}"
              else:
                inspector_label = driver.find_element(
                  By.CSS_SELECTOR, ".inspector-header-action"
                ).text
                assert inspector_label == "インスペクター", (
                  f"{width}x{height}: inspector label {inspector_label!r}"
                )

              assert (
                document_metrics["scrollWidth"] <= document_metrics["clientWidth"] + 1
              ), (
                f"{width}x{height}: horizontal overflow "
                f"{document_metrics['scrollWidth']} > {document_metrics['clientWidth']}"
              )

              severe_console = [
                entry
                for entry in driver.get_log("browser")
                if entry.get("level") == "SEVERE"
                and "favicon.ico" not in entry.get("message", "")
              ]
              assert not severe_console, (
                f"{width}x{height}: severe console entries {severe_console}"
              )

              results.append({
                "viewport": f"{width}x{height}",
                "lang": lang,
                "header_block_label": header_block_label,
                "plan_label": plan_label,
                "file_label": file_label,
                "search_aria": search_label,
                "graph_editor_aria": graph_editor_label,
                "inspector_surface": "localized",
                "horizontal_overflow": "none",
                "console_severe": 0,
                "document_metrics": document_metrics,
                "body_sample": body_text[:500],
              })
          finally:
            driver.quit()

          print(json.dumps({
            "kind": "live-japanese-pages-smoke",
            "url": base_url,
            "results": results,
          }, ensure_ascii=False))
          PY
