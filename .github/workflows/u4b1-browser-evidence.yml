name: U4b1 Browser Evidence
on:
  push:
    branches: [chatgpt/177-u4b1-browser-evidence]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Start Vite and Chrome
        run: |
          cd ui
          npm install --ignore-scripts --no-audit --no-fund
          nohup npm run dev -- --host 127.0.0.1 > /tmp/u4b1-vite.log 2>&1 &
          python -m pip install --disable-pip-version-check selenium==4.36.0
      - name: Validate native drop interactions
        run: |
          python - <<'PY'
          import json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          opts=Options()
          for flag in ('--headless=new','--no-sandbox','--disable-dev-shm-usage'):
            opts.add_argument(flag)
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          try:
            for width in (1440,480):
              driver.set_window_size(width,900)
              driver.get('http://127.0.0.1:5173/')
              WebDriverWait(driver,40).until(lambda d:d.find_elements(By.CSS_SELECTOR,'.react-flow__node'))
              before=driver.find_elements(By.CSS_SELECTOR,'.react-flow__node')
              driver.execute_script("""
                const d=new DataTransfer();
                d.items.add(new File(['invalid'],'other.txt',{type:'text/plain'}));
                window.testFileDrop=d;
                document.querySelector('.app-shell').dispatchEvent(new DragEvent('dragenter',{dataTransfer:d,bubbles:true,cancelable:true}));
              """)
              WebDriverWait(driver,5).until(lambda d:d.find_elements(By.CSS_SELECTOR,'.file-drop-overlay'))
              driver.execute_script("""
                document.querySelector('.app-shell').dispatchEvent(new DragEvent('drop',{dataTransfer:window.testFileDrop,bubbles:true,cancelable:true}));
              """)
              WebDriverWait(driver,5).until(lambda d:d.find_element(By.CSS_SELECTOR,'.file-operation-status').text.find('.algoram.json')>=0)
              # Construct a canonical Graph from the same fixture as current user canvas.
              result=driver.execute_async_script("""
                const done=arguments[arguments.length-1];
                import('/src/fixture.ts').then(m=>{
                  const g=m.demoBundle.graphs[m.demoBundle.rootGraphId];
                  const d=new DataTransfer();
                  d.items.add(new File([JSON.stringify(g)],'valid.algoram.json',{type:'application/json'}));
                  const shell=document.querySelector('.app-shell');
                  shell.dispatchEvent(new DragEvent('dragenter',{dataTransfer:d,bubbles:true,cancelable:true}));
                  shell.dispatchEvent(new DragEvent('drop',{dataTransfer:d,bubbles:true,cancelable:true}));
                  done(g.id);
                }).catch(e=>done('ERROR:'+e.message));
              """)
              assert not result.startswith('ERROR:'),result
              WebDriverWait(driver,8).until(lambda d:'valid.algoram.json' in d.find_element(By.CSS_SELECTOR,'.file-operation-status').text)
              palette=driver.find_elements(By.CSS_SELECTOR,'.palette-item[draggable=true]')
              if not palette:
                driver.find_element(By.CSS_SELECTOR,'.canvas-toolbar-actions button').click()
              WebDriverWait(driver,5).until(lambda d:d.find_elements(By.CSS_SELECTOR,'.palette-item[draggable=true]'))
              old_count=len(driver.find_elements(By.CSS_SELECTOR,'.react-flow__node'))
              drag=driver.execute_script("""
                const source=document.querySelector('.palette-item[draggable=true]');
                const surface=document.querySelector('.canvas-surface');
                const dt=new DataTransfer();
                source.dispatchEvent(new DragEvent('dragstart',{dataTransfer:dt,bubbles:true,cancelable:true}));
                const box=surface.getBoundingClientRect();
                const x=box.left+box.width*0.65, y=box.top+box.height*0.45;
                const over=new DragEvent('dragover',{dataTransfer:dt,bubbles:true,cancelable:true,clientX:x,clientY:y});
                surface.dispatchEvent(over);
                surface.dispatchEvent(new DragEvent('drop',{dataTransfer:dt,bubbles:true,cancelable:true,clientX:x,clientY:y}));
                return {type:dt.types,prevented:over.defaultPrevented};
              """)
              assert drag['prevented'],f'palette drop not allowed: {drag}'
              WebDriverWait(driver,10).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'.react-flow__node'))==old_count+1)
              scroll=driver.execute_script('return [document.documentElement.scrollWidth,document.documentElement.clientWidth]')
              assert scroll[0]<=scroll[1]+1,f'overflow {width}: {scroll}'
              serious=[x for x in driver.get_log('browser') if x['level']=='SEVERE' and 'favicon.ico' not in x['message']]
              assert not serious,serious
              print(json.dumps({'viewport':str(width)+'x900','invalid_file':'rejected','valid_file':'opened','palette_drop':'added','old_count':old_count,'new_count':old_count+1,'overflow':'none','console_severe':0},ensure_ascii=False))
          finally:
            driver.quit()
          PY
