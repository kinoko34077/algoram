name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Rust performance baseline
        run: cargo run --release -p algoram-perf-baseline

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node toolchain
        run: |
          node --version
          npm --version
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Navigation checks
        run: npm run test:navigation
      - name: Navigation scale baseline
        run: npm run perf:navigation
      - name: Annotation checks
        run: npm run test:annotations
      - name: Presentation state checks
        run: npm run test:presentation
      - name: UIUX protocol structural checks
        run: npm run test:ui-protocol
      - name: Browser platform boundary
        run: npm run test:platform
      - name: Smooth interaction guard
        run: npm run test:interaction
      - name: Canonical Graph authoring checks
        run: npm run test:authoring
      - name: Graph validation browser/Core parity
        run: npm run test:validation-parity
      - name: Block authoring checks
        run: npm run test:block-authoring
      - name: ELK layout performance baseline
        run: npm run perf:baseline

  python-c-ctypes-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build C shared library
        run: |
          cc --version
          mkdir -p /tmp/algoram-interop
          cc -shared -fPIC -Wall -Wextra -Werror \
            fixtures/python-c-ctypes/bridge.c \
            -o /tmp/algoram-interop/libalgoram_bridge.so
      - name: Call through Python ctypes
        run: |
          python3 --version
          result="$(python3 fixtures/python-c-ctypes/call.py /tmp/algoram-interop/libalgoram_bridge.so 21)"
          test "$result" = "42"
      - name: ctypes C ABI performance baseline
        run: python3 fixtures/python-c-ctypes/bench.py /tmp/algoram-interop/libalgoram_bridge.so 100000
