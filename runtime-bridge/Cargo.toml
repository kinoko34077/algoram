[package]
name = "algoram-runtime-bridge"
version = "0.1.0"
edition = "2021"
description = "Loopback browser-to-guarded-runtime bridge for Algoram"

[dependencies]
algoram-core = { path = "../core" }
algoram-interop = { path = "../interop" }
algoram-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
